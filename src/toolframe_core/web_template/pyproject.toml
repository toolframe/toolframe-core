[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-web-notes"
version = "0.1.0"
description = "Persistent notes with a Toolframe Web presentation"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.4.0+web.1"]

[project.optional-dependencies]
web = ["toolframe-web==0.1.0"]

[project.entry-points."toolframe.plugins"]
web-notes = "toolframe_web_notes.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_web_notes"]
