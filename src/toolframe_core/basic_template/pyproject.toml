[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-basic"
version = "0.1.0"
description = "A minimal Toolframe service plugin"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.4.1"]

[project.entry-points."toolframe.plugins"]
basic = "toolframe_basic.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_basic"]
