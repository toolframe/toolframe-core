[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-core"
version = "0.6.4"
description = "Persistent control host for isolated Toolframe plugins"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = [
  "LICENSE", "NOTICE",
  "src/toolframe_core/bundled_skills/toolframe-plugin-design/LICENSE",
  "src/toolframe_core/bundled_skills/toolframe-plugin-design/assets/sample-plugin/LICENSE",
]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
  "toolframe-sdk==0.3.0", "fastapi-cordis==0.2.2", "fastapi==0.135.2",
  "uvicorn==0.42.0", "httpx>=0.28,<1", "websockets>=15,<17",
  "tomlkit>=0.13,<1", "packaging>=25", "watchfiles>=1,<2", "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-core"
Repository = "https://github.com/toolframe/toolframe-core"
Documentation = "https://github.com/toolframe/toolframe-core#readme"
Issues = "https://github.com/toolframe/toolframe-core/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]
tracing = ["toolframe-sdk[tracing]==0.3.0"]

[project.scripts]
toolframe-core = "toolframe_core.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "hatchling>=1.27,<2", "fastmcp==4.0.0", "opentelemetry-sdk>=1.44,<2", "opentelemetry-exporter-otlp-proto-http>=1.44,<2"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
fastapi-cordis = { path = "../fastapi-cordis", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_core"]
exclude = ["src/toolframe_core/bundled_skills/*/evals/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
