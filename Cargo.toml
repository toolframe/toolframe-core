[package]
name = "lite-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A zero-config local SQLite dashboard and MCP server"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
local-ip-address = "0.6"
rmcp = { version = "3.2", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
strip = true
lto = "thin"

