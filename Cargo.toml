[package]
name = "lite-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust-supervised UV and FastMCP hub for startup-loaded Python tools"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
local-ip-address = "0.6"
pep440_rs = "0.7.3"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
strip = true
lto = "thin"
