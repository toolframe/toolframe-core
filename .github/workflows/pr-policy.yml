name: Pull request policy

on:
  workflow_call:
  # Keep a stable required check for title edits without repeating native CI.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - uses: commit-check/commit-check-action@b6819c7bfd40f576d670a78712646a67f2659ff3 # commit-check 2.18.3
        with:
          message: true
          branch: false
          pr-title: true
          pr-comments: false
