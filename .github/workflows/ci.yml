name: CI

on:
  pull_request:
  push:
    # publish.yml validates release tags in the publication run itself.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit
