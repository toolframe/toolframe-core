name: Container images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - .github/workflows/container-security.yml
      - .github/actions/scan-container/**
      - scripts/*container*.py
      - tests/test_container_*.py
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      release_artifacts:
        description: Use the validated launcher artifacts from this workflow run
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both tested variants to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, distroless]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read the version and registry namespace
        id: metadata
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          # PRs exercise packaging with an available public runtime; source CI
          # validates the unreleased Core independently.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            version=${tag#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY_OWNER,,}/toolframe" >> "$GITHUB_OUTPUT"
      - name: Download the validated launcher from this publication run
        if: inputs.release_artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-release
          path: build/candidate/
      - name: Verify the bundle and stage this platform's release
        if: inputs.release_artifacts
        env:
          TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
          TOOLFRAME_TARGET: ${{ matrix.target }}
        run: >-
          python scripts/ci/artifacts.py export --bundle build/candidate
          --kind release --target "$TOOLFRAME_TARGET" --output build/container-release
      - name: Stage the verified executable
        env:
          USE_ARTIFACTS: ${{ inputs.release_artifacts }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          options=()
          if [ "$USE_ARTIFACTS" = true ]; then
            options+=(--release-dir build/container-release)
          fi
          python scripts/prepare-container.py --architecture "$ARCH" --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" "${options[@]}"
      - name: Build the native image
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          docker buildx build --platform "linux/$ARCH" --target "$VARIANT" \
            --pull --no-cache-filter runtime \
            --build-arg "TOOLFRAME_VERSION=$VERSION" \
            --build-arg "TOOLFRAME_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=false --load --tag toolframe-check:local .
      - name: Verify public interfaces, persistence and shutdown
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python scripts/verify-container.py --image toolframe-check:local \
            --variant "$VARIANT" --platform "linux/$ARCH" \
            --output build/container-verification.json
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence-${{ matrix.variant }}-${{ matrix.arch }}
          path: build/container-verification*
          if-no-files-found: warn
          retention-days: 7
      - name: Scan the tested image before publication
        uses: ./.github/actions/scan-container
        with:
          image: toolframe-check:local
          platform: linux/${{ matrix.arch }}
          image-source: docker
      - name: Save security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-${{ matrix.variant }}-${{ matrix.arch }}
          path: build/security/
          if-no-files-found: warn
          retention-days: 7
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact locally tested image
        if: inputs.publish
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ref="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$VARIANT-$ARCH"
          docker tag toolframe-check:local "$ref"
          docker push "$ref"
          mkdir -p build/digests
          docker image inspect --format '{{index .RepoDigests 0}}' "$ref" \
            > "build/digests/$VARIANT-$ARCH.txt"
      - name: Save the tested image digest
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: build/digests/*.txt
          if-no-files-found: error

  publish:
    name: Publish multi-platform tags
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-digest-*
          merge-multiple: true
          path: build/digests/
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures after all four checks pass
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=$(gh release view --repo "$GH_REPO" --json tagName --jq .tagName)
          for variant in standard distroless; do
            suffix=""
            alias=latest
            if [ "$variant" = distroless ]; then
              suffix=-distroless
              alias=distroless
            fi
            mapfile -t refs < <(cat build/digests/"$variant"-*.txt)
            test "${#refs[@]}" -eq 2
            tags=(--tag "$IMAGE:$VERSION$suffix")
            if [ "$latest" = "v$VERSION" ] && [[ "$VERSION" != *-* ]]; then
              tags+=(--tag "$IMAGE:$alias")
            fi
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
            docker buildx imagetools inspect "$IMAGE:$VERSION$suffix"
          done
