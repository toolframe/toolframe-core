name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Validate and rebuild at the tag instead of promoting main artifacts
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: publish-${{ github.ref }}-pypi
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Require the exact project version tag
        run: python scripts/ci/check-release.py --ref "$GITHUB_REF"
      - name: Check public native download verification
        run: python -m unittest discover -s scripts/ci -p test_verify_native_downloads.py

  quality:
    needs: release-tag
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/quality.yml

  validate:
    needs: [release-tag, quality]
    uses: ./.github/workflows/validate.yml
    with:
      reuse-stage: release
      rebuild: ${{ inputs.rebuild }}
    secrets: inherit

  publish-core:
    needs: [release-tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Download the bundle validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: build/candidate/
      - name: Verify and stage the exact Core distributions
        env:
          TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
        run: python scripts/ci/artifacts.py export --bundle build/candidate --kind core --output dist
      - name: Publish Core using its Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/

  publish-launcher:
    needs: [release-tag, validate, publish-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi-launcher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Download the bundle validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: build/candidate/
      - name: Verify and stage all four exact native wheels
        env:
          TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
        run: python scripts/ci/artifacts.py export --bundle build/candidate --kind wheel --output dist
      - name: Publish the launcher using its Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/

  release-binaries:
    needs: [validate, publish-core, publish-launcher]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: build/candidate/
      - name: Verify and stage the exact release archives
        env:
          TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
        run: python scripts/ci/artifacts.py export --bundle build/candidate --kind release --output releases
      - name: Prepare the public checksum file
        run: |
          cat releases/SHA256SUMS-*.txt > releases/SHA256SUMS
          (cd releases && sha256sum --check SHA256SUMS)
      - name: Attest the exact release assets from this tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: releases/*
      - name: Publish verified executables and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.txt <<'EOF'
          Install the native CLI with `uv tool install toolframe`, or download the matching archive below and place `toolframe` on PATH. The wheel and archive contain the same executable.

          Supported platforms: macOS 12+ (Apple Silicon and Intel), and Linux glibc 2.28+ (ARM64 and x86-64). First use prepares Python and public dependencies with uv. Windows and musl Linux are not included.

          Start an application with `toolframe --home ./my-app init --template entry-register`, then `toolframe --home ./my-app serve`. Run `toolframe --home ./my-app open` in another terminal for the local sign-in link.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "Toolframe $RELEASE_TAG" \
            --notes-file release-notes.txt releases/*.tar.gz releases/SHA256SUMS \
            releases/SHA256SUMS-*.txt releases/manifest-*.json releases/*.whl

  verify-release-downloads:
    name: Public native archive (${{ matrix.target }})
    needs: release-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: false
      - name: Download this run's trusted comparison bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release
          path: build/candidate/
      - name: Download and verify public assets before execution
        run: |
          python scripts/ci/verify-native-downloads.py \
            --bundle build/candidate --output build/public-native \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --target "$RELEASE_TARGET"
      - name: Exercise the public archive with published dependencies
        run: |
          python scripts/verify-release.py \
            --binary build/public-native/bin/toolframe \
            --architecture "$RELEASE_TARGET" \
            --output build/public-native/acceptance.json
          python scripts/verify-skill.py \
            --binary build/public-native/bin/toolframe \
            --output build/public-native/skill.json
      - name: Retain public download verification and acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-native-${{ matrix.target }}
          path: build/public-native/*.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  publish-containers:
    needs: [release-binaries, verify-release-downloads]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true
      release_artifacts: true
