name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index (select the matching vVERSION tag as the run ref)
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Require the exact project version tag
        run: python scripts/ci/check-release.py --ref "$GITHUB_REF"

  validate:
    needs: release-tag
    uses: ./.github/workflows/validate.yml

  publish:
    needs: [release-tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/
      - name: Publish using the selected Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
