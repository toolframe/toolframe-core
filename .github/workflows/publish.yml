name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index (select the matching vVERSION tag as the run ref)
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Require the exact project version tag
        run: python scripts/ci/check-release.py --ref "$GITHUB_REF"

  validate:
    needs: release-tag
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  publish-core:
    needs: [release-tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Require the complete Core release set
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('dist').iterdir())
          assert len(list(Path('dist').glob('toolframe_core-*.whl'))) == 1
          assert len(list(Path('dist').glob('toolframe_core-*.tar.gz'))) == 1
          assert len(files) == 2
          PY
      - name: Publish Core using its Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  publish-launcher:
    needs: [release-tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}-launcher
    permissions:
      id-token: write
    steps:
      - name: Download all four validated native wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launcher-wheel-*
          merge-multiple: true
          path: dist/
      - name: Require the complete launcher release set
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('dist').iterdir())
          assert len(list(Path('dist').glob('toolframe-*.whl'))) == 4
          assert len(files) == 4
          PY
      - name: Publish the launcher using its Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  release-binaries:
    needs: [validate, publish-core, publish-launcher]
    if: inputs.index == 'pypi'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: launcher-release-*
          merge-multiple: true
          path: releases/
      - name: Publish verified executables and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat releases/SHA256SUMS-*.txt > releases/SHA256SUMS
          (cd releases && sha256sum --check SHA256SUMS)
          cat > release-notes.txt <<'EOF'
          Install the native CLI with `uv tool install toolframe`, or download the matching archive below and place `toolframe` on PATH. The wheel and archive contain the same executable.

          Supported platforms: macOS 12+ (Apple Silicon and Intel), and Linux glibc 2.28+ (ARM64 and x86-64). First use prepares Python and public dependencies with uv. Windows and musl Linux are not included.

          Start an application with `toolframe --home ./my-app init --template entry-register`, then `toolframe --home ./my-app serve`. Run `toolframe --home ./my-app open` in another terminal for the local sign-in link.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "Toolframe $RELEASE_TAG" \
            --notes-file release-notes.txt releases/*.tar.gz releases/SHA256SUMS releases/manifest-*.json releases/*.whl

  publish-containers:
    needs: release-binaries
    if: inputs.index == 'pypi'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      publish: true
      release_artifacts: true
