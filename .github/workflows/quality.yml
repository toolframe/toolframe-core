name: Code quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - name: Check the source branch or selected release tag
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/ci/check-release.py --ref "$GITHUB_REF"
          else
            python scripts/check_branch_name.py "$BRANCH_NAME"
          fi

  code-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.8'
          enable-cache: false
      - name: Check Python lint and formatting
        run: uvx prek==0.5.5 run ruff-check ruff-format --all-files --show-diff-on-failure

  commit-policy:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-policy.yml
