name: Validate distributions and launchers

on:
  workflow_call:

permissions:
  contents: read

# Concurrency belongs to the caller: a reusable workflow must not cancel it.
jobs:
  postgres:
    name: PostgreSQL journal and mixed SQL storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TOOLFRAME_CORE_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TOOLFRAME_POSTGRES_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
      TOOLFRAME_POSTGRES_PG_RESTORE: /usr/lib/postgresql/16/bin/pg_restore
      TOOLFRAME_REPOSITORY_TOKEN: ${{ secrets.TOOLFRAME_READ_TOKEN }}
      TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.8'
          enable-cache: false
      - name: Install matching PostgreSQL backup tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Verify journals, mixed storage and failure recovery
        run: >-
          python scripts/ci/validate.py --checks postgres --output build/ci-postgres
          --repository-owner "$TOOLFRAME_REPOSITORY_OWNER"
      - name: Save PostgreSQL validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-validation
          path: |
            build/ci-postgres/*.json
            build/ci-postgres/workspace.txt
          if-no-files-found: warn
  python:
    name: Python integration and distribution
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # github.repository_owner is the base repository owner, including fork PRs.
      TOOLFRAME_REPOSITORY_TOKEN: ${{ secrets.TOOLFRAME_READ_TOKEN }}
      TOOLFRAME_REPOSITORY_OWNER: ${{ vars.TOOLFRAME_REPOSITORY_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.8'
          enable-cache: false
      - name: Validate in a fresh pinned workspace
        run: >-
          python scripts/ci/validate.py --checks python --output build/ci-python
          --repository-owner "$TOOLFRAME_REPOSITORY_OWNER"
      - name: Save validated Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: build/ci-python/python-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save Python validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-validation
          path: |
            build/ci-python/*.json
            build/ci-python/*.xml
            build/ci-python/workspace.txt
          if-no-files-found: warn
          retention-days: 14

  launcher:
    uses: ./.github/workflows/launcher.yml
    secrets: inherit
