name: Scan a Toolframe container
description: Retain the full vulnerability inventory and enforce publication policy
inputs:
  image:
    description: Local image tag or public registry reference
    required: true
  platform:
    description: Linux platform to scan
    required: true
  image-source:
    description: Trivy image source (docker or remote)
    required: true
runs:
  using: composite
  steps:
    - name: Install the verified scanner from GitHub Releases
      shell: bash
      env:
        TRIVY_VERSION: '0.76.0'
      run: |
        case "$RUNNER_ARCH" in
          X64)
            architecture=64bit
            checksum=e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
            ;;
          ARM64)
            architecture=ARM64
            checksum=aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c
            ;;
          *) echo "Unsupported scanner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        archive="trivy_${TRIVY_VERSION}_Linux-${architecture}.tar.gz"
        directory="$RUNNER_TEMP/toolframe-trivy"
        mkdir -p "$directory"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --silent --show-error --location --retry 3 --retry-all-errors \
          --connect-timeout 15 --max-time 180 \
          --output "$directory/$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
        printf '%s  %s\n' "$checksum" "$directory/$archive" | sha256sum --check --strict
        tar -xzf "$directory/$archive" -C "$directory" trivy
        "$directory/trivy" --version
        echo "$directory" >> "$GITHUB_PATH"
    - name: Scan every severity and keep the package inventory
      shell: bash
      env:
        SCAN_IMAGE: ${{ inputs.image }}
        SCAN_PLATFORM: ${{ inputs.platform }}
        SCAN_SOURCE: ${{ inputs.image-source }}
      run: |
        mkdir -p build/security
        trivy image --image-src "$SCAN_SOURCE" --platform "$SCAN_PLATFORM" \
          --scanners vuln --ignorefile '' --disable-telemetry --list-all-pkgs \
          --timeout 10m --format json --output build/security/scan.json "$SCAN_IMAGE"
        trivy version --format json > build/security/scanner.json
        trivy convert --format cyclonedx --output build/security/sbom.cdx.json build/security/scan.json
    - name: Enforce the security policy
      shell: bash
      run: |
        python3 scripts/check-container-security.py build/security/scan.json \
          --summary build/security/summary.md
    - name: Add findings to the run summary
      if: always()
      shell: bash
      run: |
        if [ -f build/security/summary.md ]; then
          cat build/security/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
