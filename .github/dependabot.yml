version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:23'
      timezone: Etc/UTC
    open-pull-requests-limit: 4
    commit-message:
      prefix: fix(container)
    pull-request-branch-name:
      prefix: chore
      template: '{prefix}/{name}'
    groups:
      # Catch every version and security update, including major versions.
      # To split a dependency out, add a named group before these catch-alls;
      # exclusions would fall back to noncompliant solo dependency/version names.
      containers:
        applies-to: version-updates
        patterns: ['*']
      container-sec:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # The launcher accepts uv >=0.13.7,<0.14.0.
      # Validate a new minor series before widening this range.
      - dependency-name: astral-sh/uv
        versions: ['<0.13.7', '>=0.14.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:23'
      timezone: Etc/UTC
    open-pull-requests-limit: 4
    commit-message:
      prefix: chore(ci)
    pull-request-branch-name:
      prefix: chore
      template: '{prefix}/{name}'
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
